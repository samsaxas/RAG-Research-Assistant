name: CI

# Runs on every push (any branch) and on every pull request.
on:
  push:
  pull_request:

# If you push again while a run is in progress, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Tests use the TF-IDF backend and a fake Gemini client, so they need no secrets, no network
      # and no model downloads.
      - name: Run tests (pytest)
        run: pytest

  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The light (TF-IDF) image keeps CI fast; the only difference from the production image is
      # that it skips installing PyTorch and pre-downloading the HuggingFace model.
      - name: Build image
        run: docker build --build-arg EMBEDDING_BACKEND=tfidf -t rag-api:ci .

      - name: Start container
        run: docker run -d --name rag -p 8080:8080 rag-api:ci

      - name: Smoke test /health and /ask
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/health | tee health.json
          curl --fail --silent --show-error -X POST http://localhost:8080/ask \
            -H 'Content-Type: application/json' \
            -d '{"question": "How many days of paid annual leave do full-time employees get?", "k": 2}' \
            | tee ask.json
          grep -q '"company_handbook.pdf"' ask.json

      - name: Container logs (on failure)
        if: failure()
        run: docker logs rag
